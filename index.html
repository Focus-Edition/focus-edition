<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Access to Work — Focus Edition. A short-attention, mission-based adaptation of the DWP 'Access to Work: factsheet for customers', reproduced under the Open Government Licence v3.0. Offline and self-contained.">
<meta name="author" content="Adapted edition. Source: Department for Work and Pensions (OGL v3.0).">
<title>Access to Work — Focus Edition</title>
<style>/* =========================================================================
   Focus Edition — engine styles
   Offline, self-contained, no external assets. Emojis for icons only.
   ========================================================================= */

:root {
  --bg: #f5f6f8;
  --bg2: #ffffff;
  --card: #ffffff;
  --ink: #1c2230;
  --mut: #5c667a;
  --line: #e2e6ee;
  --brand: #7c3aed;
  --brand-ink: #ffffff;
  --accent: #f59e0b;
  --ok: #16a34a;
  --ok-bg: #e9f9ee;
  --err: #dc2626;
  --err-bg: #fdecec;
  --r1: #fef3c7;   /* yellow research */
  --r1i: #7a4f00;
  --r2: #fde2e2;   /* red caution */
  --r2i: #9f1d1d;
  --r3: #dbeafe;   /* blue context */
  --r3i: #1d4ed8;
  --r4: #ede4ff;   /* purple analogy */
  --r4i: #5b3c9e;
  --shadow: 0 6px 22px rgba(20,24,40,.06);
  --rad: 16px;
  --maxw: 900px;
  --touches: 0;
}

[data-theme="dark"] {
  --bg: #0f1220;
  --bg2: #181d30;
  --card: #1b2137;
  --ink: #e8ebf5;
  --mut: #9aa4bd;
  --line: #2b3350;
  --brand: #8b5cf6;
  --brand-ink: #ffffff;
  --accent: #fbbf24;
  --ok: #34d399;
  --ok-bg: #123627;
  --err: #f87171;
  --err-bg: #431a1a;
  --r1: #3a2f10;
  --r1i: #fcd34d;
  --r2: #421d1d;
  --r2i: #fca5a5;
  --r3: #12263f;
  --r3i: #93c5fd;
  --r4: #2a1f45;
  --r4i: #d6bfff;
  --shadow: 0 6px 22px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.6;
  font-size: 17px;
  transition: background .25s ease, color .25s ease;
  overflow-x: hidden;
}

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg2) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}
.topbar .brand {
  display: flex; align-items: center; gap: 9px; flex: 1 1 auto; min-width: 0;
}
.topbar .logo { font-size: 22px; }
.topbar .btitle { font-weight: 800; letter-spacing: -.01em; font-size: 17px; }
.topbar .bsub { color: var(--mut); font-size: 12px; display: block; margin-top: -3px; }
.topbar .controls { display: flex; align-items: center; gap: 6px; }
.progress-track {
  width: 100%; height: 10px; background: var(--line);
  border-radius: 100px; overflow: hidden; flex: 1 1 100%;
}
.progress-fill {
  height: 100%; width: 0%; background: linear-gradient(90deg, var(--brand), var(--accent));
  transition: width .4s ease; border-radius: 100px;
}
.pct-label { color: var(--mut); font-size: 12px; font-variant-numeric: tabular-nums; }

button {
  font: inherit; cursor: pointer; color: inherit; background: none; border: none;
}
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: 12px; font-weight: 600;
  background: var(--bg2); border: 1px solid var(--line); color: var(--ink);
  transition: transform .06s ease, background .2s ease;
}
.btn:hover { background: var(--line); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.07); background: var(--brand); }
.btn.sm { padding: 6px 11px; font-size: 14px; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: inline-flex;
  align-items: center; justify-content: center; font-size: 18px;
  background: var(--bg2); border: 1px solid var(--line);
}
.icon-btn:hover { background: var(--line); }
.icon-btn[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

/* layout */
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 22px 16px 60px; }
#app { min-height: 100vh; }
main { display: block; }

/* generic intent: use transform-translate for list */
.mission, .homecard {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--rad);
  box-shadow: var(--shadow); padding: 22px 20px; margin-bottom: 18px;
}
h1,h2,h3,h4 { line-height: 1.25; letter-spacing: -.01em; }
h1 { font-size: 30px; margin: 4px 0 8px; }
h2 { font-size: 22px; margin: 0 0 6px; }
h3 { font-size: 18px; margin: 0 0 4px; }
p { margin: 0 0 12px; }
.mut { color: var(--mut); }
.small { font-size: 13px; }

.chiprow { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 4px; }
.chip {
  background: var(--line); border-radius: 100px; padding: 5px 11px;
  font-size: 13px; font-weight: 600; color: var(--ink);
}
.mission-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 2px; }
.meta {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; color: var(--mut); font-weight: 600;
  background: var(--line); border-radius: 100px; padding: 4px 10px;
}
.mission-stmt { font-style: italic; color: var(--mut); border-left: 3px solid var(--brand); padding: 2px 0 2px 12px; margin: 6px 0 12px; }

/* callouts */
.callout { border-radius: 14px; padding: 14px 16px; margin: 14px 0; border: 1px solid var(--line); }
.callout .ctag { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 5px; }
.c1 { background: var(--r1); border-color: color-mix(in srgb, var(--r1i) 25%, var(--line)); }
.c1 .ctag, .c1 strong { color: var(--r1i); }
.c2 { background: var(--r2); border-color: color-mix(in srgb, var(--r2i) 30%, var(--line)); }
.c2 .ctag, .c2 strong { color: var(--r2i); }
.c3 { background: var(--r3); border-color: color-mix(in srgb, var(--r3i) 30%, var(--line)); }
.c3 .ctag, .c3 strong { color: var(--r3i); }
.c4 { background: var(--r4); border-color: color-mix(in srgb, var(--r4i) 30%, var(--line)); }
.c4 .ctag, .c4 strong { color: var(--r4i); }

/* stat cards */
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.stat {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 14px 11px; text-align: center;
}
.stat .num { font-size: 26px; font-weight: 800; color: var(--brand); letter-spacing: -.02em; }
.stat .lbl { font-size: 12px; color: var(--mut); margin-top: 2px; }

/* quote / pull */
.pullquote { text-align: center; font-size: 19px; font-weight: 600; font-style: italic; margin: 18px auto; max-width: 620px; }
.pullquote .by { display: block; font-size: 13px; color: var(--mut); font-weight: 500; font-style: normal; margin-top: 8px; }

/* lists */
.focuslist { padding-left: 0; list-style: none; margin: 12px 0; }
.focuslist li { padding: 6px 0 6px 28px; position: relative; }
.focuslist li::before { content: "▸"; position: absolute; left: 4px; color: var(--brand); }
.focuslist.tick li::before { content: "✔"; color: var(--ok); }

/* tables */
.tablewrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 15px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { background: var(--bg2); font-weight: 700; position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:nth-child(even) { background: color-mix(in srgb, var(--bg2) 55%, transparent); }

/* visual chain */
.chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; margin: 14px 0; }
.chain .step {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 13px; flex: 1 1 150px; font-weight: 600; display: flex; flex-direction: column; gap: 3px;
}
.chain .step .n { font-size: 12px; color: var(--mut); font-weight: 700; }
.chain .arrow { align-self: center; font-size: 18px; color: var(--mut); }

/* timeline */
.timeline { margin: 14px 0; padding-left: 0; list-style: none; position: relative; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.timeline li { position: relative; padding: 0 0 16px 30px; }
.timeline li::before { content: ""; position: absolute; left: 4px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); border: 2px solid var(--bg); }
.timeline .tlabel { font-weight: 700; }
.timeline .tdate { color: var(--mut); font-size: 13px; }

/* keep-forever summary */
.keep {
  background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 14%, var(--card)), color-mix(in srgb, var(--accent) 12%, var(--card)));
  border: 1px solid var(--line); border-radius: var(--rad);
  padding: 16px 18px; margin: 16px 0;
}
.keep h3 { color: var(--brand); }

/* rush */
.rush { border: 1px dashed var(--brand); border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
summary { cursor: pointer; font-weight: 700; color: var(--brand); }

/* quiz */
.quiz { margin: 22px 0; }
.quiz h3 { display: flex; align-items: center; gap: 7px; }
.q { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.q .qtxt { font-weight: 700; margin-bottom: 10px; }
.opt {
  display: block; width: 100%; text-align: left; padding: 11px 13px; margin: 6px 0;
  border-radius: 11px; border: 1px solid var(--line); background: var(--card);
  font-weight: 500; transition: background .15s, border-color .15s;
}
.opt:hover { border-color: var(--brand); }
.opt .k { display: inline-flex; width: 22px; height: 22px; border-radius: 6px; align-items: center; justify-content: center; background: var(--line); margin-right: 9px; font-size: 13px; font-weight: 700; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.correct .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--err); background: var(--err-bg); }
.opt.wrong .k { background: var(--err); color: #fff; }
.opt:disabled { cursor: default; opacity: .95; }
.feedback { border-radius: 11px; padding: 11px 13px; margin-top: 10px; font-weight: 600; display: none; }
.feedback.show { display: block; }
.feedback.good { background: var(--ok-bg); color: var(--ok); }
.feedback.bad { background: var(--err-bg); color: var(--err); }
.feedback .exp { display: block; font-weight: 500; margin-top: 3px; color: var(--ink); }

/* flashcards */
.flashsection { margin: 22px 0; }
.flashgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
.flashcard { perspective: 1100px; }
.flashcard button {
  position: relative; width: 100%; height: 150px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--bg2); transition: transform .4s; transform-style: preserve-3d; text-align: left;
}
.flashcard button > span { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 14px; display: flex; flex-direction: column; justify-content: center; }
.flashcard .front { color: var(--brand); font-weight: 800; font-size: 17px; align-items: center; text-align: center; }
.flashcard .back { transform: rotateY(180deg); color: var(--ink); font-weight: 600; font-size: 14px; }
.flashcard button.flipped, .flashcard.flipped button { transform: rotateY(180deg); }
.flashcard .hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--mut); font-style: normal; font-weight: 500; }
.flashcard .hint { backface-visibility: hidden; }

/* break cards */
.breakcard {
  position: relative; border-radius: var(--rad); padding: 20px 18px; margin: 22px 0;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--card)), color-mix(in srgb, var(--brand) 16%, var(--card)));
  border: 1px solid var(--line);
}
.breakcard .bhead { font-weight: 800; font-size: 19px; display: flex; gap: 8px; align-items: center; }
.breakcard .intent { color: var(--mut); font-size: 14px; margin: 4px 0 12px; }
.timer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
.timer .clock { font-size: 42px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; min-width: 150px; }
.timer .tbtns { display: flex; gap: 6px; }
.timer .clock.done { color: var(--ok); }
.stretch { background: var(--bg2); border-radius: 12px; padding: 11px 14px; margin: 10px 0; color: var(--mut); }
.game-cmd { color: var(--mut); font-size: 14px; margin: 6px 0; }
.gameboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 250px; margin: 10px 0; }
.gamecell { aspect-ratio: 1/1; font-size: 26px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg2); }
.gamecell.done { background: var(--ok-bg); border-color: var(--ok); }
.gamestatus { font-weight: 700; font-size: 14px; margin-top: 6px; min-height: 20px; }
.gamestatus .okc { color: var(--ok); }
.gamestatus .erb { color: var(--err); }

/* mission footer buttons */
.mission-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 6px; }
.navrow { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }

/* home */
.home-hero { background: linear-gradient(135deg, var(--brand), #6d28d9 60%, #4c1d95); color: #fff; border-radius: var(--rad); padding: 22px 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
.home-hero h1 { color: #fff; }
.home-hero .sub { opacity: .92; }
.bookcard { display: block; padding: 16px 18px; }
.bookcard .btitle2 { font-weight: 800; font-size: 18px; }
.bookcard .bmeta { color: var(--mut); font-size: 13px; margin: 3px 0; }
.bookcard .bdots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.dot { width: 13px; height: 13px; border-radius: 50%; background: var(--line); border: 1px solid color-mix(in srgb, var(--mut) 30%, transparent); }
.dot.done { background: var(--ok); border-color: var(--ok); }
.dot.cur { outline: 2px solid var(--brand); outline-offset: 2px; }
.bookcard:hover { border-color: var(--brand); }

/* menu overlay */
#menu {
  position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--bg) 30%, transparent);
  backdrop-filter: blur(4px); display: none; overflow-y: auto; padding: 20px 16px;
}
#menu.open { display: block; }
.menu-panel { max-width: 720px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 18px 18px 24px; box-shadow: var(--shadow); }
.menu-panel h2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.menulist { margin-top: 8px; }
.mchapter { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; width: 100%; text-align: left; }
.mchapter:hover { background: var(--line); }
.mchapter .mnum { width: 26px; height: 26px; border-radius: 8px; background: var(--line); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: 0 0 auto; }
.mchapter.cur .mnum { background: var(--brand); color: var(--brand-ink); }
.mchapter .mtitle { flex: 1 1 auto; font-weight: 600; }
.mchapter .mdone { color: var(--ok); }

/* confetti canvas */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; }

/* certificate */
.cert { border: 2px solid var(--brand); border-radius: var(--rad); padding: 26px 22px; text-align: center; background: var(--card); margin: 18px 0; }
.cert .cbig { font-weight: 800; font-size: 22px; letter-spacing: .02em; }
.cert .name { font-size: 22px; margin: 14px auto; font-style: italic; }
.cert .name input { font: inherit; text-align: center; border: none; border-bottom: 2px dashed var(--brand); background: transparent; color: var(--brand); width: 100%; max-width: 360px; font-weight: 800; }
.cert .name input:focus { outline: none; border-bottom-color: var(--brand); }
.cert small { color: var(--mut); }

/* toast */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line); padding: 12px 18px; border-radius: 100px; box-shadow: var(--shadow); z-index: 70; opacity: 0; pointer-events: none; transition: opacity .3s; }
#toast.show { opacity: 1; }

/* skip link + focus */
.skip { position: absolute; left: -9999px; top: 0; z-index: 100; background: var(--card); color: var(--ink); padding: 10px 14px; border-radius: 0 0 10px 0; }
.skip:focus { left: 0; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

@media (max-width: 640px) {
  body { font-size: 16px; }
  .wrap { padding: 16px 12px 50px; }
  h1 { font-size: 25px; }
  .topbar { padding: 8px 10px; }
  .gameboard { max-width: 100%; grid-template-columns: repeat(3,1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .flashcard button, .flashcard button > span { transition: none !important; }
}

/* ======= PRINT ======= */
@media print {
  @page { margin: 14mm; }
  body { background: #fff; color: #000; font-size: 12pt; overflow-x: visible; }
  * { box-shadow: none !important; }
  .topbar, .no-print, #menu, #confetti, #toast, .mission-actions, .navrow, .js-only,
  .chr, .timer .tbtns, .opt, .btn, .icon-btn { display: none !important; }
  .topbar { display: none !important; }
  .wrap { max-width: 100%; padding: 0; }
  .mission, .homecard, .bookcard { border: 1px solid #000 !important; box-shadow: none; break-inside: avoid; }
  /* reveal flashcards */
  .flashcard button { transform: none !important; height: auto; min-height: 0; border: 1px solid #999; }
  .flashcard button > span { position: static; transform: none !important; backface-visibility: visible !important; }
  .flashcard .back { display: block !important; transform: none !important; }
  .flashcard .front { display: block !important; }
  .flashcard .hint { display: none !important; }
  .flashcard .back .flipdivider { display: block !important; }
  /* reveal quiz answers */
  .quiz .opt { display: block !important; }
  .quiz .opt .flipanswer { display: inline !important; }
  .quiz .opt[data-correct="1"] { border-color: #16a34a !important; background: #e9f9ee !important; }
  .quiz .opt[data-correct="1"] .k { background: #16a34a !important; color: #fff !important; }
  .quiz .feedback { display: none !important; }
  /* flipcard internal - show both faces stacked */
  .flashcard button { display: block; }
  .flashcard button > span { position: relative; inset: auto; height: auto; }
  /* callouts print in color */
  .c1 { background: #fff7dd; }
  .c2 { background: #ffeaea; }
  .c3 { background: #eaf3ff; }
  .c4 { background: #f1eaff; }
  .home-hero { background: #4c1d95 !important; color: #fff !important; }
  a { color: #4c1d95; }
  .breakcard { border: 1px dashed #000; }
  .cert { border-color: #000; }
}
</style>
</head>

<div id="app" role="main"></div>

<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================================
   Access to Work — Focus Edition
   Source: "Access to Work: factsheet for customers", Department for Work and

   ADAPTATION NOTICE: This is a restructured, abridged adaptation of the source
   document. Content has been re-organised into short missions, reworded for
   readability, and given quizzes and flashcards. No factual claims have been
   added that are not in the source. It is not an official DWP publication and
   is not endorsed by DWP or the UK Government.

   Contains public sector information licensed under the Open Government
   Licence v3.0.

BOOKS = [
{
  id: "atw",
  title: "Access to Work",
  author: "Department for Work and Pensions",
  volume: "Focus Edition",
  emoji: "🧭",
  tagline: "A government grant that can pay for the support you need at work",
  intro: "The DWP factsheet, re-cut into 13 short missions. Access to Work is a publicly funded grant for disabled people and people with health conditions — including ADHD. It can pay for equipment, travel, coaching, and mental health support at work. This edition is an adaptation of the official GOV.UK factsheet, which is published under the Open Government Licence v3.0.",
  missions: [

  /* ---------------------------------------------------------------- 1 */
  {
    id: "atw-what",
    num: "Mission 1",
    title: "What Access to Work actually is",
    est: "4 min",
    mission: "Access to Work is a government grant that pays for practical support so you can start work, stay in work, or move into self-employment.",
    chips: ["Publicly funded grant", "Never paid back", "Doesn't affect benefits", "Physical or mental health"],
    rush: "Access to Work is a publicly funded employment support programme. It gives grants for practical support if you have a disability or a physical or mental health condition. The money does not have to be paid back, and it will not affect your other benefits.",
    sections: [

(function () {

  function allMissions() {

  /* ---------------- break card (timer + game) ---------------- */
  function breakHTML() {
    var h =
      '<div class="breakcard no-print" data-break>' +
        '<div class="bhead">🧩 Intentional break</div>' +
        '<div class="intent">This pause is on purpose. Short, deliberate breaks are how attention stays fresh — taking them is the point, not the interruption.</div>' +
        '<div class="stretch">🚶 Stand up &middot; stretch &middot; look at something 6+ metres away (20+ ft) to rest your eyes.</div>' +
        '<div class="timer">' +
          '<div class="clock" aria-live="polite">1:30</div>' +
          '<div class="tbtns">' +
            '<button class="btn sm js-timer-start" type="button">▶ Start</button>' +
            '<button class="btn sm js-timer-pause" type="button" disabled>⏸ Pause</button>' +
            '<button class="btn sm js-timer-reset" type="button">↺ Reset</button>' +
          '</div>' +
        '</div>' +
        '<div class="game-cmd">👀 Tiny reset game — tap the emoji that doesn’t belong. 3 rounds, go.</div>' +
        '<div class="gameboard" role="group" aria-label="Spot the odd emoji game"></div>' +
        '<div class="gamestatus" aria-live="polite"></div>' +
      '</div>';
    return h;
  }

  function wireBreak(root) {
    var card = root.querySelector("[data-break]");
    if (!card) return;
    var clock = card.querySelector(".clock");
    var start = card.querySelector(".js-timer-start");
    var pause = card.querySelector(".js-timer-pause");
    var reset = card.querySelector(".js-timer-reset");
    var total = 90, left = 90, running = false, iv = null;
    function fmt(s) { var m = Math.floor(s / 60), ss = s % 60; return m + ":" + (ss < 10 ? "0" : "") + ss; }
    function paint() { clock.textContent = fmt(left); clock.classList.toggle("done", left === 0); }
    function stop() { running = false; clearInterval(iv); iv = null; pause.disabled = true; start.disabled = false; }
    function tick() { left--; paint(); if (left <= 0) { stop(); toast("⏱ Break done — well done."); } }
    start.addEventListener("click", function () {
      if (left === 0) left = total;
      if (running) return; running = true; start.disabled = true; pause.disabled = false;
      stop(); running = true; iv = setInterval(tick, 1000);
    });
    pause.addEventListener("click", function () { if (running) { stop(); } });
    reset.addEventListener("click", function () { stop(); left = total; paint(); });

    // game
    var board = card.querySelector(".gameboard");
    var status = card.querySelector(".gamestatus");
    var POOLS = [
      ["😀", "😃"],
      ["🍎", "🍏"],
      ["🐶", "🐱"],
      ["🔵", "🔴"],
      ["⚽", "🏀"],
      ["🌙", "☀️"]
    ];
    var round = 0, solved = 0;
    function newRound() {
      if (round >= 3) { status.innerHTML = "<span class='okc'>✓ Focus reset! Nailed it.</span>"; return; }
      var pool = POOLS[round % POOLS.length];
      var odd = Math.floor(Math.random() * 9);
      var cells = [];
      for (var i = 0; i < 9; i++) cells.push(i === odd ? pool[1] : pool[0]);
      // shuffle
      cells.sort(function () { return Math.random() - 0.5; });
      board.innerHTML = "";
      cells.forEach(function (c, idx) {
        var b = el("button", "gamecell", c);
        b.setAttribute("type", "button");
        b.addEventListener("click", function () {
          if (b.classList.contains("done") || b.classList.contains("mis")) return;
          if (c === pool[1]) {
            b.classList.add("done");
            status.innerHTML = "<span class='okc'>✓ Found it!</span>";
            round++; newRound();
          } else {
            b.classList.add("mis");
            b.style.background = "var(--err-bg)";
            status.innerHTML = "<span class='erb'>✗ That one belongs.</span>";
            setTimeout(function () { b.style.background = ""; }, 500);
          }
        });
        board.appendChild(b);
      });
    }
    newRound();
  }

  /* ---------------- quiz renderer ---------------- */
  function renderQuiz(m) {
    var qs = (m.quiz || []).slice(0, 4);
    if (!qs.length) return "";
    var saved = store.quiz[m.id] || {};
    var h = '<div class="quiz" data-quiz="' + m.id + '"><h3>🧠 Quick check — 4 questions</h3>';
    h += '<p class="small mut">Answer and get instant feedback. Correct = +1 point. You can revisit any time.</p>';

      var chosen = saved[i];
      var answered = typeof chosen === "number";
      h += '<div class="q" data-q="' + i + '">';
      h += '<div class="qtxt"><span class="mut">Q' + (i + 1) + ".</span> " + q.q + "</div>";
      q.opts.forEach(function (o, oi) {
        var cls = "opt";
        var key = String.fromCharCode(65 + oi);
        var mark = "";

        if (chosen === q.a) h += "<span>✓ Correct! +1 point.</span>";
        else h += "<span>✗ Not quite — the right answer is highlighted.</span>";
        if (q.exp) h += '<span class="exp">' + expFor(chosen, q) + "</span>";
      }
      h += "</div></div>";
    });
    h += "</div>";
    return h;
  }
  // Explanation: prefer a question-specific explanation; else generic split by correct/wrong
  function expFor(chosen, q) {
    if (q.exp) return q.exp;

    return "The gold answer is highlighted above.";
  }
  function wireQuiz(root) {
    var quiz = root.querySelector("[data-quiz]");

      qBox.querySelectorAll(".opt").forEach(function (optBtn) {
        optBtn.addEventListener("click", function () {

          store.quiz[mId] = saved;

    app.innerHTML = hero + '<main>' + how + certCard + '<h2>Choose the missions</h2>' + dots + disc + refs + "</main>";

      a.addEventListener("click", function (e) { e.preventDefault(); openBook(a.getAttribute("data-openwork")); });
    });
    if (doneLap) app.querySelector(".js-gocert").addEventListener("click", function () { showCert(); });
    updateProgress();
  }

  function renderReferences() {
    var h = '<section class="homecard"><h2>🗂️ Sources &amp; licence</h2>' +
      '<p class="small mut">This edition adapts <strong>one</strong> source document. The licence that makes it legal to republish is set out below in full.</p><div class="tablewrap"><table><thead><tr><th>Item</th><th>Detail</th></tr></thead><tbody>';
    var seen = [];
    var topics = [
      ["Source document", "Access to Work: factsheet for customers", "Department for Work and Pensions"],
      ["Where it lives", "<a href='https://www.gov.uk/government/publications/access-to-work-factsheet/access-to-work-factsheet-for-customers' rel='noopener'>gov.uk/government/publications/access-to-work-factsheet</a>", "the official version"],
      ["Licence", "Open Government Licence v3.0 — <a href='https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/' rel='noopener'>nationalarchives.gov.uk/doc/open-government-licence/version/3</a>", "permits copying, adaptation and commercial use"],
      ["Required attribution", "Contains public sector information licensed under the Open Government Licence v3.0.", "stated as mandated by the licence"],
      ["Source copyright", "© Crown copyright", "reproduced under the OGL — not by permission of DWP"],
      ["Excluded by the licence", "Personal data, logos, crests and the Royal Arms", "none reproduced here"],
      ["Status", "Adapted summary — NOT the official document", "check the current GOV.UK version before acting"]
    ];
    topics.forEach(function (t) { h += "<tr><td>" + t[0] + "</td><td>" + t[1] + (t[2] ? " <span class=\u0022mut small\u0022>(" + t[2] + ")</span>" : "") + "</td></tr>"; });
    h += "</tbody></table></div>";
    h += '<p class="small mut">Access to Work is a publicly funded employment support programme. This adaptation reproduces no departmental logos, crests or personal data, implies no official status, and is not endorsed by the Department for Work and Pensions or the UK Government. For the definitive position, read the original GOV.UK factsheet or call the helpline on <strong>0800 121 7479</strong>.</p></section>';
    return h;
  }

  function openBook(id) {
    var b = findBook(id);
    if (!b) return;
    // resume at first not-done mission, else first
    var target = b.missions[0];
    for (var i = 0; i < b.missions.length; i++) { if (!isDone(b.missions[i].id)) { target = b.missions[i]; break; } }
    current = { book: b, mission: target, i: BOOKS.indexOf(b), j: b.missions.indexOf(target) };
    renderMission(current);
  }

  function findBook(id) { for (var i = 0; i < BOOKS.length; i++) if (BOOKS[i].id === id) return BOOKS[i]; return null; }

  /* ---------------- topbar ---------------- */
  function updateTopbar() {
    var bt = document.querySelector(".btitle");
    var sub = document.querySelector(".bsub");
    if (current) { bt.textContent = "Focus Edition"; sub.textContent = current.book.title + " · " + current.mission.title; }
    else { bt.textContent = "Focus Edition"; sub.textContent = runtimeTitle(); }
    var pct = pctDone();
    document.querySelector(".progress-fill").style.width = pct + "%";
    document.querySelector(".pct-label").textContent = pct + "% complete · " + store.points + " pts";
    var dm = document.querySelector("[data-theme-btn]");
    dm.setAttribute("aria-pressed", store.theme === "dark" ? "true" : "false");
    dm.textContent = store.theme === "dark" ? "☀️" : "🌙";
    dm.title = "Toggle dark mode (press T)";
  }
  function updateProgress() { updateTopbar(); if (menuEl) renderMenu(menuEl._bookId, menuEl._open); }

  /* ---------------- menu ---------------- */
  function openMenu() {
    var bookId = current ? current.i : null;
    renderMenu(bookId, null);
    menuEl.classList.add("open");
    menuEl._open = true;
  }
  function closeMenu() { menuEl.classList.remove("open"); menuEl._open = false; }

  function renderMenu(bookId, ignoreOpen) {
    var html = '<div class="menu-panel"><h2>☰ Missions <span class="small mut">' + pctDone() + "% done · " + store.points + " pts</span></h2>";
    BOOKS.forEach(function (b, bi) {
      html += '<h3 style="margin-top:16px">' + b.emoji + " " + esc(b.title) + "</h3>";
      b.missions.forEach(function (m, mi) {
        var iscur = current && current.mission.id === m.id;
        html += '<button class="mchapter' + (iscur ? " cur" : "") + '" data-goto="' + m.id + '">' +
          '<span class="mnum">' + (mi + 1) + '</span><span class="mtitle">' + esc(m.title) + '</span>' +
          (isDone(m.id) ? '<span class="mdone">✓</span>' : "") +
          "</button>";
      });
    });
    if (totalMissions() > 0 && doneCount() === totalMissions()) {
      html += '<button class="mchapter" data-gocert="1"><span class="mnum">🏆</span><span class="mtitle">View certificate</span></button>';
    }
    html += '<div class="navrow"><button class="btn" data-close="1">Close ✕</button></div></div>';
    menuEl.innerHTML = html;
    menuEl.querySelectorAll("[data-goto]").forEach(function (b) {
      b.addEventListener("click", function () { var m = findMission(b.getAttribute("data-goto")); closeMenu(); renderMission(m); });
    });
    menuEl.querySelectorAll("[data-close]").forEach(function (b) {
      b.addEventListener("click", closeMenu);
    });
    menuEl.querySelectorAll("[data-gocert]").forEach(function (b) {
      b.addEventListener("click", function () { closeMenu(); showCert(); });
    });
  }

  /* ---------------- confetti ---------------- */
  function celebrate() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { showCert(); return; }
    var ctx = confettiEl.getContext("2d");
    var W = confettiEl.width = window.innerWidth;
    var H = confettiEl.height = window.innerHeight;
    var colors = ["#7c3aed", "#f59e0b", "#16a34a", "#3b82f6", "#ec4899", "#fbbf24"];
    var parts = [], N = 140;
    for (var i = 0; i < N; i++) parts.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.4, w: 6 + Math.random() * 8, h: 8 + Math.random() * 8, c: colors[Math.floor(Math.random() * colors.length)], vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * Math.PI });
    var run = true, frame = 0;
    function step() {
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) { p.y += p.vy; p.x += p.vx; p.r += 0.03; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
      frame++;
      if (frame < 260 && parts.some(function (p) { return p.y < H + 40; })) requestAnimationFrame(step);
      else { confettiEl.getContext("2d").clearRect(0, 0, W, H); setTimeout(showCert, 300); }
    }
    requestAnimationFrame(step);
  }
  function showCert() {
    var name = store.certName || "";
    var cert = '<section class="cert"><div class="cbig">🏆 Certificate of Completion</div>' +
      '<p class="mut">This certifies that</p>' +
      '<div class="name"><input type="text" id="certname" value="' + esc(name) + '" placeholder="Your name" aria-label="Your name" /></div>' +
      '<p>has completed the <strong>' + esc(runtimeTitle()) + "</strong> Focus Edition — " + totalMissions() + " missions, " + maxPoints() + " points.</p>" +
      '<p class="small mut">' + new Date().toLocaleDateString() + "</p>" +
      '<div class="mission-actions"><button class="btn primary no-print" data-printcert="1">🖨️ Print / save as PDF</button></div></section>';
    var holder = document.querySelector(".cert-slot");
    if (!holder) { var d = document.createElement("div"); d.className = "cert-slot"; app.appendChild(d); holder = d; }
    holder.innerHTML = cert;
    var inp = holder.querySelector("#certname");
    inp.addEventListener("input", function () { store.certName = inp.value; save(); });
    holder.querySelector("[data-printcert]").addEventListener("click", function () { window.print(); });
    toast("🏆 All missions complete!"); updateTopbar();
  }

  /* ---------------- theme ---------------- */
  function setTheme(t) { store.theme = t; document.documentElement.setAttribute("data-theme", t); save(); updateTopbar(); }
  function toggleTheme() { setTheme(store.theme === "dark" ? "light" : "dark"); }

  /* ---------------- routing ---------------- */
  /* Render EVERY mission in one continuous flow — used for print/PDF of the whole edition. */
  function renderPrintAll() {
    current = null;
    var html = '';
    html += '<section class="print-head"><h1>🎯 ' + esc(runtimeTitle()) + '</h1>' +
      '<p class="mut">' + totalMissions() + ' missions across ' + BOOKS.length + ' books. Read-only version for printing/PDF — the interactive version is the <strong>.html</strong> file.</p>' +
      '<p class="small mut"><strong>Contains public sector information licensed under the Open Government Licence v3.0.</strong> Adaptation of “Access to Work: factsheet for customers” (Department for Work and Pensions, GOV.UK). This is a general summary, not the official document, and is not endorsed by DWP or the UK Government. Scheme rules, amounts and contact details change — check GOV.UK or call 0800 121 7479 before relying on anything here.</p></section>';
    BOOKS.forEach(function (b, bi) {
      html += '<section class="print-book"><h2 style="margin-top:34px">' + b.emoji + ' ' + esc(b.title) + '</h2>' +
        '<p class="mut small">' + esc(b.author) + (b.volume ? ' · ' + esc(b.volume) : '') + ' — ' + esc(b.tagline || '') + '</p>';
      b.missions.forEach(function (m) {
        var chips = (m.chips || []).map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join("");
        var meta = '<span class="meta">⏱ ' + esc(m.est || "8 min") + '</span><span class="meta">🎯 ' + (m.quiz || []).length + ' quiz</span>' + (m.flash && m.flash.length ? '<span class="meta">🗂️ ' + m.flash.length + ' cards</span>' : '');
        html += '<article class="mission" style="break-inside:auto;box-shadow:none">';
        html += '<p class="small mut">' + esc(b.title) + ' · ' + esc(m.num || '') + '</p>';
        html += '<h2>🎯 ' + esc(m.title) + '</h2>';
        html += '<div class="mission-meta no-print">' + meta + '</div>';
        html += '<div class="chiprow no-print">' + chips + '</div>';
        if (m.mission) html += '<div class="mission-stmt">' + m.mission + '</div>';
        (m.sections || []).forEach(function (s) { html += renderSection(s); });
        html += renderFlash(m);
        html += renderQuiz(m);   // reveal answers via print CSS (opt.correct/.wrong shown, feedback shown)
        if (m.keep) html += '<div class="keep"><h3>📌 Keep-forever</h3><p>' + m.keep + '</p></div>';
        html += '</article>';
      });
      html += '</section>';
    });
    html += '<section class="print-ref">' + renderReferences() + '</section>';
    app.innerHTML = html;
    updateProgress();
    // reveal correct answers & card backs for print: add a class that the print CSS keys off
    document.body.className = 'printall';
  }

  function initialRoute() {
    var hash = location.hash;
    if (hash && hash.indexOf('#printall') === 0) { renderPrintAll(); return; }
    if (hash && hash.indexOf("#/m/") === 0) {
      var m = findMission(hash.slice(4));
      if (m) { renderMission(m); return; }
    }
    // resume last
    if (store.last) { var ml = findMission(store.last); if (ml) { renderMission(ml); return; } }
    if (BOOKS.length) { renderHome(); }
  }
  function setHash(m) { try { history.replaceState(null, "", "#/m/" + m.id); } catch (e) {} }

  /* ---------------- boot ---------------- */
  function buildTopbar() {
    var bar = document.createElement("div");
    bar.className = "topbar";

    var brand = document.createElement("div");
    brand.className = "brand";
    var logo = el("span", "logo", "🎯");
    var titleWrap = el("div");
    titleWrap.innerHTML = '<span class="btitle">Focus Edition</span><span class="bsub">' + runtimeTitle() + "</span>";
    brand.appendChild(logo); brand.appendChild(titleWrap);
    brand.style.cursor = "pointer";
    brand.title = "Go to home";
    brand.setAttribute("role", "button");
    brand.setAttribute("aria-label", "Go to home");
    brand.addEventListener("click", function () { closeMenu(); renderHome(); });

    var controls = el("div", "controls");
    var menuB = el("button", "icon-btn", "☰"); menuB.title = "Menu"; menuB.setAttribute("aria-label", "Open menu"); menuB.id = "menubtn";
    var dm = el("button", "icon-btn", "🌙"); dm.setAttribute("data-theme-btn", "true"); dm.setAttribute("aria-label", "Toggle dark mode"); dm.setAttribute("aria-pressed", "false");
    dm.title = "Toggle dark mode (press T)";
    controls.appendChild(menuB); controls.appendChild(dm);

    var track = el("div", "progress-track");
    track.innerHTML = '<div class="progress-fill" style="width:0%"></div>';
    var pct = el("div", "pct-label", "0% complete");

    bar.appendChild(brand);
    var hideTrack = true; // progress track on its own row
    bar.appendChild(controls);
    bar.appendChild(track);
    bar.appendChild(pct);

    menuB.addEventListener("click", openMenu);
    dm.addEventListener("click", toggleTheme);

    document.body.insertBefore(bar, app);
    document.querySelector("[data-theme-btn]").addEventListener("click", toggleTheme);
  }

  function runtimeTitle() { return "Access to Work — Focus Edition"; }

  /* ---------------- keyboard ---------------- */
  function onKey(e) {
    if (e.key === "t" || e.key === "T") { if (ignorableTarget(e.target)) return; if (!menuEl.classList.contains("open")) toggleTheme(); }
    if (e.key === "Escape") { if (menuEl.classList.contains("open")) { closeMenu(); } return; }
    if (e.key === "ArrowLeft") { if (ignorableTarget(e.target) || menuEl.classList.contains("open")) return; if (current && prevOf(current)) renderMission(prevOf(current)); }
    if (e.key === "ArrowRight") { if (ignorableTarget(e.target) || menuEl.classList.contains("open")) return; if (current && nextOf(current)) renderMission(nextOf(current)); }
  }
  function ignorableTarget(t) { return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable); }

  function fallbackError(err) {
    if (app && app.innerHTML && app.innerHTML.length > 20) return; // content already rendered
    if (app) {
      app.innerHTML =
        "<section class='homecard'><h2>⚠️ Something went wrong on load</h2>" +
        "<p class='mut'>This page hit an error while starting up. Details: <code>" +
        esc(String(err && err.message ? err.message : err)) + "</code></p>" +
        "<p class='small mut'>If this keeps happening, try opening the file directly in a browser (double-click it, or File → Open) rather than a built-in preview.</p></section>";
    }
  }

  function init() {
    try {
      load();
      app = document.getElementById("app");
      menuEl = document.getElementById("menu");
      confettiEl = document.getElementById("confetti");
      toastEl = document.getElementById("toast");
      if (!app) return;
      if (store.theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
      buildTopbar();
      document.documentElement.setAttribute("data-theme", store.theme);
      var dmBtn = document.querySelector("[data-theme-btn]");
      if (dmBtn) { dmBtn.textContent = store.theme === "dark" ? "☀️" : "🌙"; dmBtn.setAttribute("aria-pressed", store.theme === "dark" ? "true" : "false"); }
      menuEl.addEventListener("click", function (e) { if (e.target === menuEl) closeMenu(); });
      document.addEventListener("keydown", onKey);
      initialRoute();
      updateTopbar();
    } catch (err) { fallbackError(err); }
  }

  // Safety net: if anything throws after the app has started, surface it
  // instead of silently leaving a blank page.
  window.addEventListener("error", function (e) { fallbackError(e && e.error ? e.error : e.message); });
  window.addEventListener("unhandledrejection", function (e) { fallbackError(e && e.reason ? e.reason : "unhandled rejection"); });

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
