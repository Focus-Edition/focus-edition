function toBionic(text,fix=0.45,op=0.55){
  if(!text||!state.prefs.bionic) return text;
  return text.split(/(\s+)/).map(w=>{
    if(/^\s+$/.test(w)) return w;
    if(w.length<=2) return w;
    if(/^[^a-zA-Z0-9]+$/.test(w)) return w;
    const m=w.match(/^([^a-zA-Z0-9]*)([a-zA-Z0-9']+)([^a-zA-Z0-9]*)$/);
    if(!m) return w;
    const pre=m[1],core=m[2],post=m[3];
    if(core.length<=2) return w;
    const len=Math.max(1,Math.ceil(core.length*fix));
    return `${pre}<b>${core.slice(0,len)}</b><span style="opacity:${op}">${core.slice(len)}</span>${post}`;
  }).join('');
}

  if(live) state.selectedEdition=live;
  state.selectedMission=null;
  state.view='editionDetail';
  render();
};
window.openMissionById=function(mid){
  // Try selectedEdition first, then search all
  let ed=state.selectedEdition;
  let m=ed?.missions.find(x=>x.id===mid);
  if(!m){
    for(const e of state.editions){
      const found=e.missions.find(x=>x.id===mid);
      if(found){ed=e;m=found;break;}
    }
  }
  if(!m||!ed){toast('Mission not found — open edition first');return;}
  state.selectedEdition=ed;
  state.selectedMission=JSON.parse(JSON.stringify(m));
  state.view='missionDetail';
  render();
};
window.closeMission=function(){state.view='editionDetail';state.selectedMission=null;render();};
window.toggleMissionById=function(edId,mid){
  const ed=state.editions.find(e=>e.id===edId);
  if(!ed) return;
  const m=ed.missions.find(x=>x.id===mid);
  if(!m) return;
  m.done=!m.done;
  ed.progress=ed.missions.filter(x=>x.done).length;
  ed.status=ed.progress===0?'draft':ed.progress===ed.totalMissions?'completed':'in_progress';
  ed.updatedAt=new Date().toISOString().slice(0,10);
  persist();
  // update selected copies
  if(state.selectedEdition&&state.selectedEdition.id===edId){
    state.selectedEdition=ed;
    if(state.selectedMission&&state.selectedMission.id===mid){
      state.selectedMission=JSON.parse(JSON.stringify(m));
    }
  }
  render();
  toast(m.done?'Mission done ✓':'Mission undone');
};

/* TTS - FIXED: second click stops */
let ttsSpeaking=false;
function speakText(txt){
  if(!('speechSynthesis' in window)){toast('TTS not supported');return;}
  if(window.speechSynthesis.speaking){
    window.speechSynthesis.cancel();
    if(ttsSpeaking){ttsSpeaking=false;toast('Stopped reading');return;}
  }
  const u=new SpeechSynthesisUtterance(txt);
  u.rate=0.95;
  ttsSpeaking=true;
  u.onend=()=>{ttsSpeaking=false;toast('Finished reading');};
  u.onerror=()=>{ttsSpeaking=false;};
  window.speechSynthesis.speak(u);
  toast('Reading aloud 🔊 — click again to stop');
}

function createEdition({title,description,source,sourceType}){
  const id='ed_'+uid();const count=5;
  const missionTemplates=[
    {t:'What it is — overview', prompt:'Overview: what this document is, who it is for, and why it matters. Core definition in one sentence.'},
    {t:'Why it matters for you', prompt:'Why this matters: real impact on work, study, daily life. 2 concrete examples for ADHD brains.'},
    {t:'How it works — step by step', prompt:'Step-by-step flow: what happens first, next, last. Include timings and who does what.'},
    {t:'What to do — action checklist', prompt:'Action checklist: 3 things to do this week. Include links, phone numbers, documents to gather.'},
    {t:'Common pitfalls & fixes', prompt:'Pitfalls: what goes wrong, how to avoid, what to say if challenged. Keep copies of everything.'},
  ];
  const missions=Array.from({length:count},(_,i)=>{
    const tmpl=missionTemplates[i%missionTemplates.length];
    return {
      id:'m_'+uid(),
      title:`Mission ${i+1} — ${tmpl.t}`,
      est:`${3+Math.floor(Math.random()*3)} min`,
      done:false,quiz:3,cards:3,
      body:`Mission ${i+1} of "${title||'your document'}" — ${tmpl.t}. ${tmpl.prompt} Source: ${source||'your upload'}. This mission is unique: focus ${i+1} of ${count}. Key idea for mission ${i+1}: ${description||'Auto-generated Focus Edition, ADHD-friendly.'}`.slice(0,420)
    };
  });
  const ed={id,title:title||'Untitled Focus Edition',description:description||'Auto-generated from upload.',source:source||'Upload',sourceType:sourceType||'pdf',status:'draft',progress:0,totalMissions:count,totalTime:`${count*4} min`,createdAt:new Date().toISOString().slice(0,10),updatedAt:new Date().toISOString().slice(0,10),tags:['new','uploaded'],cover:'📄',color:'bg-[#6D4AFF]',missions};
  state.editions.unshift(ed);persist();return ed;
}
function deleteEdition(id){if(!confirm('Delete this edition?'))return;state.editions=state.editions.filter(e=>e.id!==id);persist();state.view='editions';state.selectedEdition=null;state.selectedMission=null;toast('Deleted');render();}
function duplicateEdition(id){const src=state.editions.find(e=>e.id===id);if(!src)return;const copy={...JSON.parse(JSON.stringify(src)),id:'ed_'+uid(),title:src.title+' (copy)',status:'draft',progress:0,createdAt:new Date().toISOString().slice(0,10),missions:src.missions.map(m=>({...m,done:false}))};state.editions.unshift(copy);persist();toast('Duplicated');render();}

let rulerListener=null;
function setupRuler(){
  const ruler=$('#ruler');if(!ruler)return;
  if(rulerListener) document.removeEventListener('mousemove',rulerListener);
  if(!state.prefs.readingRuler){ruler.style.display='none';return;}
  ruler.style.display='block';
  rulerListener=e=>{if(state.prefs.readingRuler) ruler.style.top=(e.clientY-12)+'px';};
  document.addEventListener('mousemove',rulerListener);
}

function toggleTimer(){
  if(state.timer){clearInterval(state.timer);state.timer=null;state.timerLeft=0;toast('Timer paused');render();return;}
  state.timerLeft=state.prefs.focusMinutes*60;
  state.timer=setInterval(()=>{
    state.timerLeft--;

  document.querySelectorAll('[data-flip]').forEach(b=>b.addEventListener('click',()=>{const i=b.getAttribute('data-flip');const f=document.querySelector(`[data-front="${i}"]`);const bk=document.querySelector(`[data-back="${i}"]`);if(f&&bk){f.classList.toggle('hidden');bk.classList.toggle('hidden')}}));

  document.getElementById('startTimer')?.addEventListener('click',()=>{if(state.timer){clearInterval(state.timer);state.timer=null;state.timerLeft=0;toast('Paused');render();return;}state.timerLeft=state.prefs.focusMinutes*60;state.timer=setInterval(()=>{state.timerLeft--;const d=document.getElementById('timerDisplay');if(d){const m=Math.floor(state.timerLeft/60),s=state.timerLeft%60;d.textContent=`${m}:${String(s).padStart(2,'0')}`}if(state.timerLeft<=0){clearInterval(state.timer);state.timer=null;toast('Focus done! 🎉');try{if(window.Notification&&Notification.permission==='granted')new Notification('Focus done')}catch{}render()}},1000);toast(`Timer ${state.prefs.focusMinutes}m started`);render()});
  document.getElementById('mobileMenuBtn')?.addEventListener('click',()=>document.getElementById('mobileDrawer')?.classList.remove('hidden'));
  document.getElementById('focusModeBtnMission')?.addEventListener('click',()=>{state.prefs.focusMode=!state.prefs.focusMode;persist();render()});
  document.querySelector('[data-back-to-edition]')?.addEventListener('click',()=>{state.view='editionDetail';state.selectedMission=null;render()});
  document.querySelector('[data-toggle-mission-detail]')?.addEventListener('click',()=>{if(state.selectedEdition&&state.selectedMission){const ed=state.editions.find(e=>e.id===state.selectedEdition.id);const m=ed?.missions.find(x=>x.id===state.selectedMission.id);if(m){m.done=!m.done;ed.progress=ed.missions.filter(x=>x.done).length;ed.status=ed.progress===0?'draft':ed.progress===ed.totalMissions?'completed':'in_progress';persist();state.selectedEdition=ed;state.selectedMission=JSON.parse(JSON.stringify(m));render();toast(m.done?'Mission done ✓':'Undone')}}});
  document.querySelector('[data-prev-mission]')?.addEventListener('click',()=>{if(!state.selectedEdition||!state.selectedMission)return;const idx=state.selectedEdition.missions.findIndex(x=>x.id===state.selectedMission.id);if(idx>0){state.selectedMission=JSON.parse(JSON.stringify(state.selectedEdition.missions[idx-1]));render()}});
  document.querySelector('[data-next-mission]')?.addEventListener('click',()=>{if(!state.selectedEdition||!state.selectedMission)return;const idx=state.selectedEdition.missions.findIndex(x=>x.id===state.selectedMission.id);if(idx<state.selectedEdition.missions.length-1){state.selectedMission=JSON.parse(JSON.stringify(state.selectedEdition.missions[idx+1]));render()}else{state.view='editionDetail';state.selectedMission=null;toast('All missions viewed!');render()}});
}

function handleFile(f){state.upload.file=f;state.upload.title=f.name.replace(/\.[^/.]+$/,'').replace(/[-_]/g,' ').slice(0,60)+' — Focus Edition';state.upload.desc=`Auto-generated from ${f.name}. Rebuilt as short missions.`;toast(`Loaded ${f.name} ✓`);const btn=document.getElementById('continueUpload');if(btn)btn.disabled=false;}
function startConversion(){
  if(!state.upload.file&&(state.upload.text||'').length<100){toast('Add file or 100+ chars');return;}
  state.upload.step=2;state.upload.progress=0;state.upload.stage='Uploading…';render();
  const stages=[{p:15,t:'OCR & extracting…'},{p:35,t:'Detecting structure…'},{p:55,t:'Chunking into missions…'},{p:75,t:'Generating quiz…'},{p:90,t:'Building flashcards…'},{p:100,t:'Finalizing…'}];
  let i=0;const iv=setInterval(()=>{if(i>=stages.length){clearInterval(iv);state.upload.step=3;state.upload.title=state.upload.title||'Pasted Document — Focus Edition';state.upload.desc=state.upload.desc||'Auto-generated Focus Edition.';render();return;}state.upload.progress=stages[i].p;state.upload.stage=stages[i].t;const bar=document.getElementById('convBar');if(bar)bar.style.width=stages[i].p+'%';const st=document.getElementById('convStage');if(st)st.textContent=stages[i].t;i++;},650);
}

function bindLogin(){document.getElementById('loginForm')?.addEventListener('submit',e=>{e.preventDefault();login(document.getElementById('email').value.trim())});document.getElementById('demoBtn')?.addEventListener('click',()=>login('alex@focus-edition.app'));}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.prefs.focusMode){state.prefs.focusMode=false;persist();render();toast('Exited focus — ESC')}});
render();
</script>
